name: Deploy to GitHub Pages

on:
  # Static content is refreshed locally and deployment is started manually.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate checked-in static content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("content/index.json").read_text(encoding="utf-8"))
          expected = 0
          for category in manifest.values():
              if category.get("flat"):
                  expected += len(category.get("reports", []))
              else:
                  expected += sum(
                      len(model.get("reports", []))
                      for subcategory in category.get("subcategories", [])
                      for model in subcategory.get("models", [])
                  )
          generated = len(list(Path("content/reports").rglob("*.json")))
          if expected == 0 or generated != expected:
              raise SystemExit(f"Invalid report cache: expected {expected}, generated {generated}")
          print(f"Validated {generated} cached reports")

          search_index = json.loads(Path("content/search-index.json").read_text(encoding="utf-8"))
          if len(search_index) != expected or any(not item.get("text") for item in search_index):
              raise SystemExit(
                  f"Invalid search index: expected {expected}, generated {len(search_index)}"
              )
          print(f"Validated {len(search_index)} full-text search entries")

          reports = list(Path("content/reports").rglob("*.json"))
          referenced_assets = set()
          for report in reports:
              data = json.loads(report.read_text(encoding="utf-8"))
              referenced_assets.update(data.get("images", {}).values())
          missing = [path for path in referenced_assets if not Path(path).is_file() or Path(path).stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing or empty cached images: {missing[:10]}")
          generated_assets = [path for path in Path("content/assets").rglob("*") if path.is_file()]
          if len(generated_assets) != len(referenced_assets):
              raise SystemExit(
                  f"Invalid image cache: {len(referenced_assets)} referenced, {len(generated_assets)} generated"
              )
          print(f"Validated {len(generated_assets)} cached images")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
