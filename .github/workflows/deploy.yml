name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "new_docs" ]
  schedule:
    # Re-fetch content from GitCode repos daily at 2:17 AM UTC
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch content from GitCode repos
        env:
          PREFETCH_REPORTS: "1"
        run: |
          python build_content.py

      - name: Validate static report cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("content/index.json").read_text(encoding="utf-8"))
          expected = 0
          for category in manifest.values():
              if category.get("flat"):
                  expected += len(category.get("reports", []))
              else:
                  expected += sum(
                      len(model.get("reports", []))
                      for subcategory in category.get("subcategories", [])
                      for model in subcategory.get("models", [])
                  )
          generated = len(list(Path("content/reports").rglob("*.json")))
          if expected == 0 or generated != expected:
              raise SystemExit(f"Invalid report cache: expected {expected}, generated {generated}")
          print(f"Validated {generated} cached reports")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
